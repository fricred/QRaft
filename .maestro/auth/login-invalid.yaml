appId: io.gothcorp.qraft
name: auth/login-invalid
tags:
  - auth
  - phase1
---
- launchApp:
    clearState: true
- runFlow: ../helpers/dismiss-permissions.yaml
- runFlow: ../launch/ump-accept.yaml
- assertVisible:
    id: "welcome_screen_root"
- scrollUntilVisible:
    element:
      id: "welcome_login_cta"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "welcome_login_cta"
- assertVisible:
    id: "login_screen_root"
- tapOn:
    id: "login_email_field"
- inputText: invalid@example.com
- tapOn:
    id: "login_password_field"
- inputText: wrong-password-123
# Press Enter to submit (keyboard occludes login_submit_button on iOS sim).
- pressKey: Enter
# When SupabaseAuthProvider returns an AuthException, AuthWrapper in main.dart:178-212
# REPLACES the login screen with a full-screen "Authentication Error" Scaffold (currentUser
# stays null, errorMessage becomes non-null). So login_screen_root is gone — the bar is
# that an error UI surfaces, NOT that we stay on the login screen.
- extendedWaitUntil:
    visible:
      text: "Authentication Error"
    timeout: 15000
