appId: io.gothcorp.qraft
name: auth/forgot-password
tags:
  - auth
  - phase1
---
- launchApp:
    clearState: true
- runFlow: ../helpers/dismiss-permissions.yaml
- runFlow: ../launch/ump-accept.yaml
- assertVisible:
    id: "welcome_screen_root"
- scrollUntilVisible:
    element:
      id: "welcome_login_cta"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "welcome_login_cta"
- assertVisible:
    id: "login_screen_root"
- tapOn:
    id: "login_forgot_password_link"
- assertVisible:
    id: "forgot_password_dialog_root"
- tapOn:
    id: "forgot_password_email_field"
- inputText: ${MAESTRO_TEST_EMAIL}
# Forgot-password email field is wired to onFieldSubmitted: _handleSendResetEmail,
# so Enter triggers send without needing to dismiss keyboard / tap send.
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: "forgot_password_success_state"
    timeout: 15000
