appId: io.gothcorp.qraft
name: auth/logout
tags:
  - auth
  - phase1
---
- launchApp:
    clearState: true
- runFlow: ../helpers/dismiss-permissions.yaml
- runFlow: ../launch/ump-accept.yaml
- runFlow: ../helpers/login.yaml
# Sign-out lives on the Profile screen (lib/features/profile/presentation/pages/profile_screen.dart).
# Path: dashboard tab -> profile button -> sign-out GlassButton -> confirm dialog.
- tapOn:
    id: "main_scaffold_dashboard_tab"
- tapOn:
    id: "dashboard_profile_button"
- extendedWaitUntil:
    visible:
      id: "profile_sign_out_button"
    timeout: 10000
- tapOn:
    id: "profile_sign_out_button"
- extendedWaitUntil:
    visible:
      id: "profile_sign_out_confirm_button"
    timeout: 10000
- tapOn:
    id: "profile_sign_out_confirm_button"
- extendedWaitUntil:
    visible:
      id: "welcome_screen_root"
    timeout: 15000
