appId: io.gothcorp.qraft
name: auth/logout
tags:
  - auth
  - phase1
---
- launchApp:
    clearState: true
- runFlow: ../helpers/dismiss-permissions.yaml
- runFlow: ../launch/ump-accept.yaml
- runFlow: ../helpers/login.yaml
# Profile/Marketplace tab is where the logout action typically lives. The MainScaffoldKeys
# class enumerates 5 tabs: dashboard / generate / scanner / library / marketplace.
# There is no dedicated "profile" tab in the current scaffold (verified
# lib/features/main/main_scaffold.dart). Logout is exposed inside the Library or
# Marketplace flow today; flows fall back to a text matcher so this remains
# resilient if the host screen moves.
- tapOn:
    id: "main_scaffold_marketplace_tab"
- tapOn:
    text: "(Logout|Cerrar sesión|Sign out|Log out)"
    optional: true
# Some apps put logout behind a settings icon — try a fallback if first tap missed.
- tapOn:
    text: "(Logout|Cerrar sesión|Sign out|Log out)"
    optional: true
- extendedWaitUntil:
    visible:
      id: "welcome_screen_root"
    timeout: 10000
