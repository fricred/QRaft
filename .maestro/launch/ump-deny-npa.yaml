appId: io.gothcorp.qraft
name: launch/ump-deny-npa
tags:
  - launch
  - phase1
---
- launchApp:
    clearState: true
- runFlow: ../helpers/dismiss-permissions.yaml
# `extendedWaitUntil` is the only command that takes a custom timeout — use it
# to wait for the UMP screen to appear before asserting (handles slow cold launch).
- extendedWaitUntil:
    visible:
      id: "ump_consent_screen_root"
    timeout: 15000
- tapOn:
    id: "ump_continue_button"
# In the system UMP form, tap "Manage options" (or localized variant) to reach
# the deny path. UMP system overlay text is locale-dependent; alternations
# use parenthesized regex per Maestro core selectors docs.
- tapOn:
    text: "(Manage options|Administrar opciones|Decline|Reject|Reject all)"
    optional: true
- tapOn:
    text: "(Confirm|Confirmar|Save|Save & exit)"
    optional: true
- extendedWaitUntil:
    notVisible:
      id: "ump_consent_screen_root"
    timeout: 15000
# App should still render (banners switch to npa=1).
- extendedWaitUntil:
    visible:
      id: "(welcome_screen_root|main_scaffold_dashboard_tab)"
    timeout: 10000
